# Welcome to Jekyll!
#
# This config file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, restart the server.

# Site settings
title: Hyungjin Lee
email: hyungjin.lee1004@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  LLM 서비스를 만들고 운영하는 개발자, 이형진입니다.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://hyungjiny.github.io/" # the base hostname & protocol for your site
lang: ko-KR

author:
  name: "Hyungjin Lee"
  name_ko: "이형진"

# Social / contact
github_username: HyungJiny
social:
  github: "https://github.com/HyungJiny"
  linkedin: "https://www.linkedin.com/in/hyungjin-lee-17a647113"
  instagram: "https://www.instagram.com/hyung_jiny"

# Build settings — fully self-themed (no remote theme).
markdown: kramdown
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: atom.xml

# Collections — each project is one file in _projects/ with its own detail page.
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Front Matter Defaults
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      read_time: true
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - README.md
  - DESIGN.md
  - vendor
  - .bundle
  - resume
  - CLAUDE.md
  - AGENTS.md
