---
layout: default
---

<section class="section wrap">
  <header class="section-head reveal">
    <p class="eyebrow">{{ page.eyebrow | default: 'Projects' }}</p>
    <h2 style="font-size:clamp(2rem,5vw,3.25rem);">{{ page.title }}</h2>
    {% if page.subtitle %}<p class="page__subtitle" style="margin-top:1rem;">{{ page.subtitle }}</p>{% endif %}
  </header>

  {% assign all_projects = site.projects | sort: 'order' %}
  {% include project-list.html projects=all_projects %}
</section>
